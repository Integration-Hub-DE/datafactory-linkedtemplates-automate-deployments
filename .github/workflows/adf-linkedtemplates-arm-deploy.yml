name: ADF CI-CD using Linked ARM Templates

# Controls when the workflow will run

on:                                    # Triggers the workflow on push or pull request events but only for the "<branch-name>" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  
  workflow_dispatch:                   # Allows you to run this workflow manually from the Actions tab

permissions:
  id-token: write
  contents: read
  
jobs:

# -------------------
# CI Stage - Validate and Generate ARM Template from Source ADF
# -------------------  

  Continuous-Integration:
    name: Validate and Generate ARM Template from Source ADF
    runs-on: windows-latest            # The type of runner that the job will run on

    steps:                             # Steps represent a sequence of tasks that will be executed as part of the job
      - uses: actions/checkout@v4      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it

      #- name: Setup Node.js
      #  uses: actions/setup-node@v4
      #  with
      #    node-version: '24'
      
      - name: Install npm package
        working-directory: ./build
        run: npm install

      - name: Validate ARM Template
        working-directory: ./build
        run: npm run build validate "${{ github.workspace }}" "/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ secrets.AZURE_RESOURCEGROUP_NAME }}/providers/Microsoft.DataFactory/factories/${{ secrets.SOURCE_DATA_FACTORY }}"
        
      - name: Generate ARM Template
        working-directory: ./build
        run: npm run build export "${{ github.workspace }}" "/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ secrets.AZURE_RESOURCEGROUP_NAME }}/providers/Microsoft.DataFactory/factories/${{ secrets.SOURCE_DATA_FACTORY }}" "ArmTemplate"

      - name: Upload ARM Template
        uses: actions/upload-artifact@v4
        with:
          name: ArmTemplates
          path: build/ArmTemplate

# -------------------
# CD Stage - Deploy to Target ADF
# -------------------

  Continuous-Delivery:
    name: Deploy Linked ARM Templates
    needs: Continuous-Integration
    runs-on: windows-latest
  
    steps:
  
    - uses: actions/checkout@v4
  
    - name: Download ARM Template
      uses: actions/download-artifact@v4
      with:
        name: ArmTemplates
        path: ArmTemplates
  
    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Upload linked templates to Blob Storage
      id: upload-templates
      shell: pwsh
      run: |
        $folderName = "$(Get-Date -Format 'yyyyMMdd_HHmmss')-${{ github.run_id }}"
        
        az storage blob upload-batch `
          --account-name "${{ secrets.ARM_TEMPLATE_STORAGE_ACCOUNT }}" `
          --destination "${{ secrets.ARM_TEMPLATE_CONTAINER }}/$folderName" `
          --source "${{ github.workspace }}\ArmTemplates\linkedTemplates" `
          --auth-mode login `
          --only-show-errors

        Write-Host "Templates uploaded to folder: $folderName"

        "template-folder=$folderName" >> $env:GITHUB_OUTPUT

    - name: Generate container SAS token
      id: storage-sas
      shell: pwsh
      run: |
        $expiryTime = (Get-Date).ToUniversalTime().AddHours(4).ToString("yyyy-MM-ddTHH:mmZ")
        $sasToken = az storage container generate-sas `
        --account-name "${{ secrets.ARM_TEMPLATE_STORAGE_ACCOUNT }}" `
        --name "${{ secrets.ARM_TEMPLATE_CONTAINER }}" `
        --permissions r `
        --expiry $expiryTime `
        --auth-mode login `
        --as-user `
        --https-only `
        --output tsv

        if (:IsNullOrWhiteSpace($sasToken)) {
          Write-Error "The storage container SAS token was not generated."
            exit 1
        }
          
        # The linked ARM template expects containerSasToken to include '?'.
        if (-not $sasToken.StartsWith("?")) {
          $sasToken = "?$sasToken"
        }

        # Prevent the SAS token from appearing in workflow logs.
        Write-Host "::add-mask::$sasToken"
        
        $containerUri = "https://${{ secrets.ARM_TEMPLATE_STORAGE_ACCOUNT }}.blob.core.windows.net/${{ secrets.ARM_TEMPLATE_CONTAINER }}/${{ steps.upload-templates.outputs.template-folder }}"
        "container-uri=$containerUri" >> $env:GITHUB_OUTPUT
        "container-sas-token=$sasToken" >> $env:GITHUB_OUTPUT

    - name: Deploy ARM Template
      uses: azure/arm-deploy@v2
      with:
        scope: resourcegroup
        subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        resourceGroupName: ${{ secrets.AZURE_RESOURCEGROUP_NAME }}
        template: ArmTemplates/linkedTemplates/ArmTemplate_master.json
        parameters: >
          ArmTemplates/linkedTemplates/ArmTemplateParameters_master.json
          factoryName=${{ secrets.DESTINATION_DATA_FACTORY }}
          containerUri=${{ steps.storage-sas.outputs.container-uri }}
          containerSasToken=${{ steps.storage-sas.outputs.container-sas-token }}
        deploymentMode: Incremental
